apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: device-inventory
  namespace: argocd
spec:
  description: Device Inventory API
  sourceRepos:
    - https://github.com/cezarmarinescu/device-inventory.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service